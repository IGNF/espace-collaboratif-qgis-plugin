name: CI and acceptance package

on:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  quality:
    uses: ./.github/workflows/quality.yml

  acceptance-package:
    name: Build tag acceptance package
    if: startsWith(github.ref, 'refs/tags/')
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate tag and plugin version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python - <<'PY'
          import configparser
          import os
          import re
          import sys

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?)", tag)
          if match is None:
              sys.exit(f"Tag must use vMAJOR.MINOR.PATCH format: {tag}")

          metadata = configparser.ConfigParser()
          metadata.read("ign_espace_collaboratif/metadata.txt", encoding="utf-8")
          metadata_version = metadata.get("general", "version")
          if metadata_version != match.group(1):
              sys.exit(
                  f"Tag version {match.group(1)} does not match metadata version "
                  f"{metadata_version}"
              )
          PY

      - name: Install qgis-plugin-ci
        run: python -m pip install qgis-plugin-ci==2.10.0

      - name: Build acceptance package
        run: qgis-plugin-ci package "${GITHUB_REF_NAME#v}"

      - name: Upload acceptance package
        uses: actions/upload-artifact@v7
        with:
          name: espace-collaboratif-${{ github.ref_name }}
          path: ign_espace_collaboratif.*.zip
          if-no-files-found: error
          retention-days: 90