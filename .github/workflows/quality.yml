name: Quality checks

on:
  workflow_call:

permissions:
  contents: read

jobs:
  flake8:
    name: Python syntax and style
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Flake8
        run: python -m pip install flake8==7.3.0

      - name: Check syntax and critical errors
        run: >-
          flake8 ign_espace_collaboratif
          --count
          --select=E9,F63,F7,F82
          --show-source
          --statistics

      - name: Report PEP 8 style findings (non-blocking during rollout)
        if: ${{ always() }}
        run: flake8 ign_espace_collaboratif --count --exit-zero --statistics

  bandit:
    name: Bandit security scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install Bandit
        run: python -m pip install bandit==1.8.6

      - name: Scan plugin source
        run: bandit -r ign_espace_collaboratif -f json -o bandit-report.json

      - name: Upload Bandit report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: bandit-report
          path: bandit-report.json
          if-no-files-found: ignore
          retention-days: 7

  pyqgis4-checker:
    name: PyQGIS 4 migration checker
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/qgis/pyqgis4-checker:main-ubuntu
    steps:
      - name: Checkout source
        uses: actions/checkout@v6

      - name: Run PyQGIS 4 migration check
        run: |
          pyqt5_to_pyqt6.py --dry_run --logfile pyqt6_checker.log ign_espace_collaboratif/
          pyqt5_to_pyqt6.py ign_espace_collaboratif/

      - name: Upload checker report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: pyqgis4-checker-report
          path: pyqt6_checker.log
          if-no-files-found: ignore
          retention-days: 7