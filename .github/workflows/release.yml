name: Publish QGIS plugin release

on:
  release:
    types:
      - published

permissions:
  contents: read

jobs:
  quality:
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    uses: ./.github/workflows/quality.yml

  publish:
    name: Publish stable release
    if: ${{ !github.event.release.prerelease && !github.event.release.draft }}
    needs: quality
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout release tag
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Validate release tag and plugin version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          python - <<'PY'
          import configparser
          import os
          import re
          import sys

          tag = os.environ["RELEASE_TAG"]
          match = re.fullmatch(r"v(\d+\.\d+\.\d+)", tag)
          if match is None:
              sys.exit(f"Stable release tag must use vMAJOR.MINOR.PATCH format: {tag}")

          metadata = configparser.ConfigParser()
          metadata.read("ign_espace_collaboratif/metadata.txt", encoding="utf-8")
          metadata_version = metadata.get("general", "version")
          if metadata_version != match.group(1):
              sys.exit(
                  f"Tag version {match.group(1)} does not match metadata version "
                  f"{metadata_version}"
              )
          PY

      - name: Install qgis-plugin-ci
        run: python -m pip install qgis-plugin-ci==2.10.0

      - name: Publish plugin to QGIS and attach assets to the existing release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OSGEO_USER: ${{ secrets.OSGEO_USER }}
          OSGEO_TOKEN: ${{ secrets.OSGEO_TOKEN }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          qgis-plugin-ci release "$VERSION" \
            --release-tag "$GITHUB_REF_NAME" \
            --github-token "$GITHUB_TOKEN" \
            --osgeo-username "$OSGEO_USER" \
            --osgeo-token "$OSGEO_TOKEN" \
            --create-plugin-repo